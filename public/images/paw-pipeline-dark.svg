<svg viewBox="0 0 640 780" xmlns="http://www.w3.org/2000/svg" font-family="'Public Sans', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="12" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" letter-spacing="1" fill="#a1a1aa" font-weight="600">COMPILE ONCE — PER FUNCTION DEFINITION</text>

  <!-- 1. Spec -->
  <rect x="170" y="48" width="300" height="60" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="72" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Spec</text>
  <text x="320" y="90" font-size="12" fill="#a1a1aa" text-anchor="middle">natural-language function definition</text>

  <line x1="320" y1="108" x2="320" y2="146" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Pseudo-compiler -->
  <rect x="170" y="146" width="300" height="70" rx="8" fill="#0f0f0f" stroke="#27272a" stroke-width="1.5"/>
  <text x="320" y="174" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Pseudo-compiler · 4B</text>
  <text x="320" y="194" font-size="12" fill="#a1a1aa" text-anchor="middle">frozen, off-the-shelf, just prompted</text>

  <line x1="320" y1="216" x2="320" y2="254" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Pseudo-program -->
  <rect x="170" y="254" width="300" height="60" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="278" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Pseudo-program</text>
  <text x="320" y="296" font-size="12" fill="#a1a1aa" text-anchor="middle">task restated + I/O examples</text>

  <line x1="320" y1="314" x2="320" y2="352" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bypass: spec -> LoRA compiler -->
  <path d="M470,78 L560,78 L560,388 L470,388" fill="none" stroke="#27272a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. LoRA compiler -->
  <rect x="170" y="352" width="300" height="76" rx="8" fill="#0f0f0f" stroke="#27272a" stroke-width="1.5"/>
  <text x="320" y="380" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">LoRA compiler · 4B</text>
  <text x="320" y="400" font-size="12" fill="#a1a1aa" text-anchor="middle">trained on FuzzyBench</text>
  <text x="320" y="416" font-size="12" fill="#a1a1aa" text-anchor="middle">spec + pseudo-program → adapter</text>

  <line x1="320" y1="428" x2="320" y2="466" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. LoRA adapter -->
  <rect x="170" y="466" width="300" height="60" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="490" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">LoRA adapter</text>
  <text x="320" y="508" font-size="12" fill="#a1a1aa" text-anchor="middle">~23MB · rank 64</text>

  <!-- bypass: pseudo-program -> interpreter -->
  <path d="M170,284 L80,284 L80,626 L170,626" fill="none" stroke="#27272a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="600" y1="558" x2="40" y2="558" stroke="#27272a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="40" y="580" font-size="12" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" letter-spacing="1" fill="#a1a1aa" font-weight="600">EVERY CALL — AT RUNTIME</text>

  <line x1="320" y1="526" x2="320" y2="596" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Interpreter -->
  <rect x="170" y="596" width="300" height="76" rx="8" fill="#0f0f0f" stroke="#27272a" stroke-width="1.5"/>
  <text x="320" y="624" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Interpreter · 0.6B</text>
  <text x="320" y="644" font-size="12" fill="#a1a1aa" text-anchor="middle">frozen Qwen3</text>
  <text x="320" y="660" font-size="12" fill="#a1a1aa" text-anchor="middle">loads pseudo-program, hot-swaps LoRA</text>

  <line x1="320" y1="672" x2="320" y2="710" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. Output -->
  <rect x="170" y="710" width="300" height="52" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="742" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Output</text>
</svg>
